name: Deploy ASP.NET Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Set up SSH
      uses: invi5H/ssh-action@v1.0.0
      with:
        # A unique name for the server
        SSH_USER: root
        SSH_HOST: ${{ secrets.HOST_IP }}
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        scp -o StrictHostKeyChecking=no -r ./docker-compose.yml root@${{ secrets.HOST_IP }}:/root/

    - name: Deploy to Server
      env:
        SECRET_DSN: ${{ secrets.PROD_DSN }}
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ secrets.HOST_IP }} '
          export PROD_DSN=${{ secrets.PROD_DSN }}
          cd /root/
          docker-compose pull
          docker-compose up -d
        '
